<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b1323" />
    <title>MUST 毕业画廊 · 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <p class="eyebrow">MACAO UNIVERSITY OF SCIENCE AND TECHNOLOGY</p>
      <h1>MUST 毕业画廊</h1>
      <p class="subtitle">2026 · 把这一刻好好收藏</p>
    </header>

    <main>
      <section class="toolbar" aria-label="相册操作">
        <p id="photo-count" class="photo-count">正在载入照片…</p>
        <div class="actions">
          <button id="select-all" type="button">全选</button>
          <button id="clear-selection" type="button" disabled>取消全选</button>
          <button id="download-selected" type="button" disabled>下载选中项</button>
        </div>
      </section>
      <p class="hint">点击图片放大查看；勾选图片后可批量下载。</p>
      <section id="gallery" class="gallery" aria-live="polite"></section>
      <div id="sentinel" aria-hidden="true"></div>
    </main>

    <dialog id="lightbox" class="lightbox">
      <button id="close-lightbox" class="icon-button close" type="button" aria-label="关闭">×</button>
      <button id="previous" class="icon-button previous" type="button" aria-label="上一张">‹</button>
      <figure>
        <img id="lightbox-image" alt="" />
        <figcaption id="lightbox-caption"></figcaption>
      </figure>
      <button id="next" class="icon-button next" type="button" aria-label="下一张">›</button>
      <a id="download-single" class="download-single" download>下载这张照片</a>
    </dialog>

    <template id="card-template">
      <article class="card">
        <button class="photo-button" type="button"><img loading="lazy" alt="" /></button>
        <label class="select-label"><input class="photo-select" type="checkbox" /><span>选择</span></label>
        <a class="card-download" download>下载</a>
      </article>
    </template>
    <script src="gallery.js" defer></script>
  </body>
</html>
